# Baut das Docker-Image und legt es in die GitHub Container Registry (ghcr.io/<owner>/amberwave).
# Auslöser: ein Tag wie v0.9.0-beta.1 (Release) – oder von Hand unter Actions → Docker image → Run workflow.
# Tags: genaue Version, dazu "beta" für Vorabversionen bzw. "latest" für stabile.
name: Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the web app
        uses: oven-sh/setup-bun@v2
      - run: bash app/scripts/buendeln.sh

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/amberwave
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=ref,event=branch

      # Nur amd64: der Effekt-Rechner bin/aw-render liegt bisher nur als x86-64-Programm bei.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
