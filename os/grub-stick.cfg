# Amberwave OS – Start vom USB-Stick (Live-System mit Einrichtung im Browser). toram: das System läuft komplett im
# Arbeitsspeicher, der Stick kann nach der Installation einfach abgezogen werden.
set timeout=3
set default=0
menuentry "Amberwave einrichten" {
  linux /live/vmlinuz boot=live toram components quiet console=tty1 console=ttyS0,115200n8
  initrd /live/initrd.img
}
menuentry "Amberwave einrichten (sichere Grafik)" {
  linux /live/vmlinuz boot=live toram components nomodeset console=tty1 console=ttyS0,115200n8
  initrd /live/initrd.img
}
