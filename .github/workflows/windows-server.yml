# Baut den Amberwave Windows Server (Programm im Infobereich + PHP, nginx, MariaDB, ffmpeg …), testet ihn auf einem
# Windows-Rechner und hängt das Paket als Testversion an den Lauf (kein Release, keine Ankündigung).
# Nur von Hand: Actions → Windows server → Run workflow.
name: Windows server
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Optional: fertig getestet an dieses bestehende Release hängen (Tag, z. B. v0.9.1-beta.6)'
        default: ''
  release:
    types: [published]
permissions:
  contents: read
jobs:
  tray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: llvm-mingw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="$(gh api repos/mstorsjo/llvm-mingw/releases/latest --jq '.assets[].browser_download_url' | grep -E 'ucrt-ubuntu-[0-9.]+-x86_64\.tar\.xz$' | head -1)"
          curl -fsSL "$URL" | tar -xJ -C "$RUNNER_TEMP"
          echo "LLVM_MINGW=$(ls -d "$RUNNER_TEMP"/llvm-mingw-*)" >> "$GITHUB_ENV"
      - name: Programm, Effekt-Rechner und Installationsassistent
        run: |
          pip install --quiet pillow fonttools brotli
          bash windows-server/bauen.sh "$RUNNER_TEMP/aus/Amberwave Server.exe"
          bash windows-server/installer.sh "$RUNNER_TEMP/aus"
          ls -la "$RUNNER_TEMP/aus"
      - uses: actions/upload-artifact@v4
        with:
          name: tray
          path: ${{ runner.temp }}/aus
  paket:
    needs: tray
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bash app/scripts/buendeln.sh
      - uses: actions/download-artifact@v4
        with:
          name: tray
          path: ${{ runner.temp }}/tray
      - name: Paket zusammenstellen
        run: bash windows-server/paket.sh /c/AmberwaveServer "$RUNNER_TEMP/tray"
      - name: Rauchtest
        timeout-minutes: 25
        run: bash windows-server/test.sh /c/AmberwaveServer
      - name: Installer bauen
        run: |
          V="$(grep -oE "'version' => '[^']+'" app/includes/config.php | head -1 | sed -E "s/.*'([^']+)'$/\1/")"
          echo "V=$V" >> "$GITHUB_ENV"
          rm -rf /c/AmberwaveServer/app/js/_b/*.map 2>/dev/null || true
          AW_XZ_STUFE=7 python windows-client/sfx/packen.py "$RUNNER_TEMP/tray/sfx.exe" /c/AmberwaveServer "/c/Amberwave-Windows-Server-$V.exe"
      # Nur als Anhang am Lauf (Actions → Lauf → Artifacts), 14 Tage
      - uses: actions/upload-artifact@v4
        with:
          name: Amberwave-Windows-Server-${{ env.V }}
          path: C:/Amberwave-Windows-Server-${{ env.V }}.exe
          retention-days: 14
          compression-level: 0

  # Beim Veröffentlichen eines Releases (oder von Hand mit „release“): fertig gebaut und getestet → ans Release hängen
  anhaengen:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [paket]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app/includes/config.php
      - uses: actions/download-artifact@v4
        with:
          pattern: 'Amberwave-Windows-Server-*'
          path: ${{ runner.temp }}/a
          merge-multiple: true
      - name: Ans Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release }}
        run: |
          V="$(grep -oE "'version' => '[^']+'" app/includes/config.php | head -1 | sed -E "s/.*'([^']+)'$/\1/")"
          if [ "${TAG#v}" != "$V" ]; then
            echo "::error title=Release::Gebaut wurde $V, das Release ist $TAG – nichts angehängt"; exit 1
          fi
          cd "$RUNNER_TEMP/a"
          for f in Amberwave-Windows-Server-*.exe; do [ -f "$f" ] && [ ! -f "$f.sha256" ] && sha256sum "$f" > "$f.sha256"; done
          ls -la
          gh release upload "$TAG" Amberwave-Windows-Server-*.exe *.sha256 --clobber -R "${{ github.repository }}"
          echo "::notice title=Release::$(ls Amberwave-Windows-Server-*.exe | tr '\n' ' ')an $TAG angehängt"
