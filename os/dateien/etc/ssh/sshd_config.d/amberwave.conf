# Amberwave OS: SSH nur mit Schlüssel (Einstellungen › Amberwave OS). Schlüssel und Gerätekennung liegen unter /daten.
HostKey /daten/system/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /daten/system/ssh/authorized_keys
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
